[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Sam Botello"]
repository = "https://github.com/sambotello/opencraftcutter"

[workspace.dependencies]
oc-core = { path = "crates/oc-core" }
oc-svg = { path = "crates/oc-svg" }
oc-studio3 = { path = "crates/oc-studio3" }
oc-cutter = { path = "crates/oc-cutter" }

egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui_extras = { version = "0.37", features = ["svg"] }
egui_material_icons = "0.9"
kurbo = { version = "0.13", features = ["serde"] }
lyon = "1.0"
usvg = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
i_overlay = "9"
vtracer = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
base64 = "0.22"
oc-trace = { path = "crates/oc-trace" }

[profile.dev]
opt-level = 1

# Dependencias siempre optimizadas: wgpu, egui y lyon en debug son inusablemente lentos.
[profile.dev.package."*"]
opt-level = 3
# Solo tablas de línea: backtraces con archivo:línea sin los ~30 GB de .o de debuginfo completo.
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
